spring.application.name=personal-task-manager
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.openai.base-url=https://api.openai.com/v1
app.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
app.openai.api-key=${OPENAI_API_KEY:}
app.seed.enabled=true
